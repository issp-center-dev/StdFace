# StdFace ladder (W=3) / Kondo 格子模型
# stan.in 対応例:  model="Kondo" / lattice="ladder" / W=3 / L=16 / t0=1.0 / t1=1.0 / J=1.0
# 磁場 (h/Gamma/Gamma_y) は遍歴電子と局在スピンの両方に適用される
# (python/stdface/core/model_plugin.py::KondoModel)。
# 現行実装のサイト倍加 (前半=局在 S2, 後半=遍歴) との対応は manual 4章。
# Kondo の J 結合は脚ごと (leg ごと) に 1 本、A{i}_c → A{i}_s (遍歴が第1端点)。
#
# 単位胞 = 1 ラング (W サイト、W=3 → 脚 0, 1, 2)。各脚が Kondo により
# _c (遍歴電子) / _s (局在スピン) の 2 ラベルに倍加される。
# ladder.py は NsiteUC=W と置いた後 StdI.W を 1 に固定する (ladder.py:80-81)。
# rung (旧 W) 方向が open であることの根拠: (1) _BONDS の dW 成分は常に 0、
# (2) rung/diagonal ボンドは `if uc_i < NsiteUC - 1:` の条件下でのみ生成され
# (ladder.py:184)、最後の脚 (uc_i=W-1=2) から最初の脚へ "閉じる" 結合は
# 生成されない。よって本カタログは論理的 1 次元 (L 方向のみ周期境界)。
# phase0 は内部 phase[1] に転写される (ladder.py:75-78)。chain と同型
# (CONVENTIONS.md §4)。
#
# W 一般化規則 (t/V は ladder.py:176-188 の動的ループを手展開、J→t/V に読替。
# Kondo J は各脚 uc_i について A{uc_i}_c-A{uc_i}_s R=[0] を 1 本、脚順に生成
# — expand_bonds_2d のセル内ループ順: 局所項 (Kondo J 含む) が全脚分先に
# 追加され、その後で _BONDS の t/V ボンドが追加される):
#   for uc_i in range(W): J: A{uc_i}_c-A{uc_i}_s R=[0]           <- 局所項ループ (先)
#   for uc_i in range(W):                                          <- _BONDS ループ (後)
#     leg  (脚):                  A{uc_i}_c-A{uc_i}_c   R=[1] t1/V1,  R=[2] t1'/V1'
#     if uc_i < W-1:
#       rung (セル内):            A{uc_i}_c-A{uc_i+1}_c R=[0] t0/V0
#       diag (L+1):                A{uc_i}_c-A{uc_i+1}_c R=[1] t2/V2
#       diag (L-1):                A{uc_i}_c-A{uc_i+1}_c R=[-1] t2'/V2'
# 検算 (中央脚 A1_c vs 端脚 A0_c/A2_c): W=3 では中央脚だけ rung/diag
# (t0, t2, t2', V0, V2, V2') を両側に持ち配位数が端脚の 2 倍 (2 本 vs
# 1 本)。leg 方向 (t1, t1') は全脚とも配位数 2。Kondo J 配位数は
# 各サイト (_c, _s とも) 1 で脚位置に依らず一定。
# 検算は manifest.yaml の ladder/ladder_w3_kondo.yaml エントリを参照。
# 出典: python/stdface/lattice/ladder.py::ladder (_BONDS, L176-188), commit e733ff893a52b81addd27ef7e347f77273c0d129

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: ladder, model: kondo}

geometry:
  dimension: 1
  lattice_vectors:
    a1: [1.0]                    # StdFace: Llength (既定 a=1.0)。rung 方向は非周期のため lattice_vector を持たない
  sites:
    - {label: A0_c, frac: [0.0]}  # 脚 0 (端), 遍歴電子
    - {label: A0_s, frac: [0.0]}  # 脚 0 (端), 局在スピン
    - {label: A1_c, frac: [0.0]}  # 脚 1 (中央), 遍歴電子
    - {label: A1_s, frac: [0.0]}  # 脚 1 (中央), 局在スピン
    - {label: A2_c, frac: [0.0]}  # 脚 2 (端), 遍歴電子
    - {label: A2_s, frac: [0.0]}  # 脚 2 (端), 局在スピン

system:
  finite: true
  size: [16]                     # StdFace: L
  boundary:
    - {twist: {param: phase0}}   # 度単位。内部 phase[1] へ転写 (phase[0] は常に 0)

model:
  site_dof:
    A0_c: {fermion: {orbitals: 1}}
    A0_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A1_c: {fermion: {orbitals: 1}}
    A1_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A2_c: {fermion: {orbitals: 1}}
    A2_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo 結合 (脚順、遍歴が第1端点)
    - {from: A0_c, to: A0_s, R: [0], type: J}
    - {from: A1_c, to: A1_s, R: [0], type: J}
    - {from: A2_c, to: A2_s, R: [0], type: J}
    # --- t ブロック (_c 同士、uc_i=0 → 1 → 2 の順) ---
    - {from: A0_c, to: A0_c, R: [1], type: t1}
    - {from: A0_c, to: A0_c, R: [2], type: "t1'"}
    - {from: A0_c, to: A1_c, R: [0], type: t0}
    - {from: A0_c, to: A1_c, R: [1], type: t2}
    - {from: A0_c, to: A1_c, R: [-1], type: "t2'"}
    - {from: A1_c, to: A1_c, R: [1], type: t1}
    - {from: A1_c, to: A1_c, R: [2], type: "t1'"}
    - {from: A1_c, to: A2_c, R: [0], type: t0}
    - {from: A1_c, to: A2_c, R: [1], type: t2}
    - {from: A1_c, to: A2_c, R: [-1], type: "t2'"}
    - {from: A2_c, to: A2_c, R: [1], type: t1}
    - {from: A2_c, to: A2_c, R: [2], type: "t1'"}
    # --- V ブロック (同一物理ボンド、同じ順序) ---
    - {from: A0_c, to: A0_c, R: [1], type: V1}
    - {from: A0_c, to: A0_c, R: [2], type: "V1'"}
    - {from: A0_c, to: A1_c, R: [0], type: V0}
    - {from: A0_c, to: A1_c, R: [1], type: V2}
    - {from: A0_c, to: A1_c, R: [-1], type: "V2'"}
    - {from: A1_c, to: A1_c, R: [1], type: V1}
    - {from: A1_c, to: A1_c, R: [2], type: "V1'"}
    - {from: A1_c, to: A2_c, R: [0], type: V0}
    - {from: A1_c, to: A2_c, R: [1], type: V2}
    - {from: A1_c, to: A2_c, R: [-1], type: "V2'"}
    - {from: A2_c, to: A2_c, R: [1], type: V1}
    - {from: A2_c, to: A2_c, R: [2], type: "V1'"}

  couplings:
    t0:    {operator: "hop", value: {param: t0, scale: -1.0}}
    t1:    {operator: "hop", value: {param: t1, scale: -1.0}}
    "t1'": {operator: "hop", value: {param: "t1'", scale: -1.0}}
    t2:    {operator: "hop", value: {param: t2, scale: -1.0}}
    "t2'": {operator: "hop", value: {param: "t2'", scale: -1.0}}
    V0:    {operator: "density-density", value: {param: V0}}
    V1:    {operator: "density-density", value: {param: V1}}
    "V1'": {operator: "density-density", value: {param: "V1'"}}
    V2:    {operator: "density-density", value: {param: V2}}
    "V2'": {operator: "density-density", value: {param: "V2'"}}
    J:     {operator: "s_i . S_j", value: {param: J}}   # +J s·S (第1端点=遍歴)

  onsite:
    A0_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A0_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A1_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A1_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A2_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A2_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
