# StdFace chain / Spin model
# Corresponding stan.in input:  model="Spin" / lattice="chain" / L=16 / J=1.0 (J is an alias of J0)
# See the chain/chain_spin.yaml entry of manifest.yaml for the consistency check.
# Source: python/stdface/lattice/chain_lattice.py::chain (_BONDS), commit b96aef2107f1ab200565efd496606a01184e3f46

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: chain, model: spin}

geometry:
  dimension: 1
  lattice_vectors:
    a1: [1.0]                    # StdFace: a (default 1.0)
  sites:
    - {label: A, frac: [0.0]}

system:
  finite: true
  size: [16]                     # StdFace: L (representative value)
  boundary:
    - {twist: {param: phase0}}   # in degrees. phase0=0 is equivalent to periodic

model:
  site_dof:
    A: {spin: {param: 2S, scale: 0.5, default: 0.5}}   # S = 0.5 × 2S. Default S=1/2

  bonds:
    # Preserves the source order of the reference implementation (_BONDS)
    - {from: A, to: A, R: [1], type: J0}     # nearest neighbor   (alias J)
    - {from: A, to: A, R: [2], type: "J0'"}  # next-nearest neighbor   (alias J')
    - {from: A, to: A, R: [3], type: "J0''"} # third-nearest neighbor (alias J'')

  couplings:
    # J family is in canonical 9-component form. Parameter resolution: component > scalar diagonal > global alias > 0
    J0:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J0x}}
          - {ops: [Sy, Sy], coeff: {param: J0y}}
          - {ops: [Sz, Sz], coeff: {param: J0z}}
          - {ops: [Sx, Sy], coeff: {param: J0xy}}
          - {ops: [Sx, Sz], coeff: {param: J0xz}}
          - {ops: [Sy, Sx], coeff: {param: J0yx}}
          - {ops: [Sy, Sz], coeff: {param: J0yz}}
          - {ops: [Sz, Sx], coeff: {param: J0zx}}
          - {ops: [Sz, Sy], coeff: {param: J0zy}}
    "J0'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J0'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J0'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J0'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J0'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J0'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J0'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J0'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J0'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J0'zy"}}
    "J0''":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J0''x"}}
          - {ops: [Sy, Sy], coeff: {param: "J0''y"}}
          - {ops: [Sz, Sz], coeff: {param: "J0''z"}}
          - {ops: [Sx, Sy], coeff: {param: "J0''xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J0''xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J0''yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J0''yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J0''zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J0''zy"}}

  onsite:
    A:
      field_z:                   # -h Sz
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:                   # -Gamma Sx
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:                   # -Gamma_y Sy
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:                   # D (Sz)^2
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
