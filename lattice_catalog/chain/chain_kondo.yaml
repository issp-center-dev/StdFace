# StdFace chain / Kondo lattice model
# Corresponding stan.in input:  model="Kondo" / lattice="chain" / L=16 / t=1.0 / J=1.0
# The field (h/Gamma/Gamma_y) is applied to both the itinerant electrons and the localized spins
# (python/stdface/core/model_plugin.py::KondoModel).
# The correspondence with the current implementation's site doubling (first half = localized S2, second half = itinerant) is described in manual Section 4.
# Source: python/stdface/lattice/chain_lattice.py::chain (_BONDS), commit b96aef2107f1ab200565efd496606a01184e3f46

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: chain, model: kondo}

geometry:
  dimension: 1
  lattice_vectors:
    a1: [1.0]                    # StdFace: a
  sites:
    - {label: A_c, frac: [0.0]}  # itinerant electron (degree of freedom 1 on 1 physical site)
    - {label: A_s, frac: [0.0]}  # localized spin (degree of freedom 2, same site)

system:
  finite: true
  size: [16]                     # StdFace: L
  boundary:
    - {twist: {param: phase0}}   # in degrees

model:
  site_dof:
    A_c: {fermion: {orbitals: 1}}
    A_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo coupling follows the source order = argument order of general_j(..., itinerant, localized).
    # Itinerant A_c is the 1st endpoint (matching the role of s_i . S_j)
    - {from: A_c, to: A_s, R: [0], type: J}   # Kondo coupling (intra-cell)
    - {from: A_c, to: A_c, R: [1], type: t0}
    - {from: A_c, to: A_c, R: [2], type: "t0'"}
    - {from: A_c, to: A_c, R: [3], type: "t0''"}
    - {from: A_c, to: A_c, R: [1], type: V0}
    - {from: A_c, to: A_c, R: [2], type: "V0'"}
    - {from: A_c, to: A_c, R: [3], type: "V0''"}

  couplings:
    t0:    {operator: "hop", value: {param: t0, scale: -1.0}}
    "t0'": {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t0''": {operator: "hop", value: {param: "t0''", scale: -1.0}}
    V0:    {operator: "density-density", value: {param: V0}}
    "V0'": {operator: "density-density", value: {param: "V0'"}}
    "V0''": {operator: "density-density", value: {param: "V0''"}}
    J:     {operator: "s_i . S_j", value: {param: J}}   # +J s·S (1st endpoint = itinerant)

  onsite:
    A_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A_s:
      field_z:                   # same 3 components apply to the localized side
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
