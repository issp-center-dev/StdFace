# StdFace kagome / Spin model
# Corresponding stan.in input:  model="Spin" / lattice="kagome" / W=4 / L=4 / J=1.0 (J is an alias of J0/J1/J2)
# 3-site basis A/B/C (NsiteUC=3, tau=(0,0),(1/2,0),(0,1/2)).
# J0/J1/J2 correspond respectively to the 3 types of intra/inter-cell nearest-neighbor bonds:
# J0=B-C direction, J1=A-C direction, J2=A-B direction. The primed series (J0'/J1'/J2') are
# second-nearest-neighbor bonds. A third-nearest-neighbor (pp) series does not exist in the source.
# Consistency check: the nearest-neighbor coordination number is 4 for each site (a feature of the
# kagome lattice: each site connects to only 2 of the 3 nearest-neighbor bond types, each with coordination number 2).
# See the kagome/kagome_spin.yaml entry of manifest.yaml for the consistency check.
# Source: python/stdface/lattice/kagome.py::kagome (_BONDS, L164-179), commit 20b2c3cda3a489b5dcd4c9180a19ca23e9280c73

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: kagome, model: spin}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy (default a, 0)
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly (default a/2, a*sqrt(3)/2)
  sites:
    - {label: A, frac: [0.0, 0.0]}    # tau[0]
    - {label: B, frac: [0.5, 0.0]}    # tau[1] = (1/2, 0)
    - {label: C, frac: [0.0, 0.5]}    # tau[2] = (0, 1/2)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # in degrees. phase0=0 is equivalent to periodic
    - {twist: {param: phase1}}

model:
  site_dof:
    A: {spin: {param: 2S, scale: 0.5, default: 0.5}}   # S = 0.5 × 2S. Default S=1/2
    B: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    C: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Preserves the source order of the reference implementation (_BONDS). site 0=A, 1=B, 2=C.
    # --- nearest neighbor (nn=1) ---
    - {from: A, to: B, R: [0, 0], type: J2}     # intra 0->1
    - {from: A, to: C, R: [0, 0], type: J1}     # intra 0->2
    - {from: B, to: C, R: [0, 0], type: J0}     # intra 1->2
    - {from: B, to: A, R: [1, 0], type: J2}     # along W
    - {from: C, to: A, R: [0, 1], type: J1}     # along L
    - {from: B, to: C, R: [1, -1], type: J0}    # along W-L
    # --- second-nearest neighbor (nn=2) ---
    - {from: C, to: A, R: [1, 0], type: "J1'"}   # along W, 2->0
    - {from: B, to: C, R: [1, 0], type: "J0'"}   # along W, 1->2
    - {from: B, to: A, R: [0, 1], type: "J2'"}   # along L, 1->0
    - {from: C, to: B, R: [0, 1], type: "J0'"}   # along L, 2->1
    - {from: A, to: C, R: [1, -1], type: "J1'"}  # along W-L, 0->2
    - {from: A, to: B, R: [-1, 1], type: "J2'"}  # along L-W, 0->1

  couplings:
    # J family is in canonical 9-component form. Parameter resolution: component > scalar diagonal > global alias > 0
    J0:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J0x}}
          - {ops: [Sy, Sy], coeff: {param: J0y}}
          - {ops: [Sz, Sz], coeff: {param: J0z}}
          - {ops: [Sx, Sy], coeff: {param: J0xy}}
          - {ops: [Sx, Sz], coeff: {param: J0xz}}
          - {ops: [Sy, Sx], coeff: {param: J0yx}}
          - {ops: [Sy, Sz], coeff: {param: J0yz}}
          - {ops: [Sz, Sx], coeff: {param: J0zx}}
          - {ops: [Sz, Sy], coeff: {param: J0zy}}
    J1:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J1x}}
          - {ops: [Sy, Sy], coeff: {param: J1y}}
          - {ops: [Sz, Sz], coeff: {param: J1z}}
          - {ops: [Sx, Sy], coeff: {param: J1xy}}
          - {ops: [Sx, Sz], coeff: {param: J1xz}}
          - {ops: [Sy, Sx], coeff: {param: J1yx}}
          - {ops: [Sy, Sz], coeff: {param: J1yz}}
          - {ops: [Sz, Sx], coeff: {param: J1zx}}
          - {ops: [Sz, Sy], coeff: {param: J1zy}}
    J2:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J2x}}
          - {ops: [Sy, Sy], coeff: {param: J2y}}
          - {ops: [Sz, Sz], coeff: {param: J2z}}
          - {ops: [Sx, Sy], coeff: {param: J2xy}}
          - {ops: [Sx, Sz], coeff: {param: J2xz}}
          - {ops: [Sy, Sx], coeff: {param: J2yx}}
          - {ops: [Sy, Sz], coeff: {param: J2yz}}
          - {ops: [Sz, Sx], coeff: {param: J2zx}}
          - {ops: [Sz, Sy], coeff: {param: J2zy}}
    "J0'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J0'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J0'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J0'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J0'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J0'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J0'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J0'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J0'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J0'zy"}}
    "J1'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J1'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J1'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J1'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J1'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J1'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J1'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J1'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J1'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J1'zy"}}
    "J2'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J2'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J2'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J2'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J2'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J2'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J2'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J2'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J2'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J2'zy"}}

  onsite:
    A:
      field_z:                   # -h Sz
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:                   # -Gamma Sx
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:                   # -Gamma_y Sy
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:                   # D (Sz)^2
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
    B:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
    C:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
