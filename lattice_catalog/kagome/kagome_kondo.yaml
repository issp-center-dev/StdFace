# StdFace kagome / Kondo 格子模型
# stan.in 対応例:  model="Kondo" / lattice="kagome" / W=4 / L=4 / t=1.0 / J=1.0
# 3 物理サイト A/B/C、各々を _c (遍歴電子) / _s (局在スピン) の 2 ラベルに分解
# (CONVENTIONS 6.7章)。Kondo J ボンドは物理サイトごとに 1 本、遍歴側が
# 第 1 端点 (A_c→A_s, B_c→B_s, C_c→C_s) — 参照実装が単位胞内の各サイトを
# 倍加する順序 (物理サイト順 A,B,C) をそのまま反映する。
# 磁場 (h/Gamma/Gamma_y) は遍歴電子と局在スピンの両方に適用される
# (python/stdface/core/model_plugin.py::KondoModel)。
# t0/t1/t2 は最近接の 3 種のセル内外ボンドにそれぞれ対応する:
# t0=B-C 方向, t1=A-C 方向, t2=A-B 方向。プライム系 (t0'/t1'/t2') は
# 第二近接ボンド。pp (第三近接) 系列はソースに存在しない。
# 現行実装のサイト倍加 (前半=局在 S2, 後半=遍歴) との対応は manual 4章。
# 出典: python/stdface/lattice/kagome.py::kagome (_BONDS, L164-179), commit 20b2c3cda3a489b5dcd4c9180a19ca23e9280c73

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: kagome, model: kondo}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A_c, frac: [0.0, 0.0]}    # 遍歴電子 (物理サイト A, tau[0])
    - {label: A_s, frac: [0.0, 0.0]}    # 局在スピン (同上)
    - {label: B_c, frac: [0.5, 0.0]}    # 遍歴電子 (物理サイト B, tau[1])
    - {label: B_s, frac: [0.5, 0.0]}    # 局在スピン (同上)
    - {label: C_c, frac: [0.0, 0.5]}    # 遍歴電子 (物理サイト C, tau[2])
    - {label: C_s, frac: [0.0, 0.5]}    # 局在スピン (同上)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # 度単位
    - {twist: {param: phase1}}

model:
  site_dof:
    A_c: {fermion: {orbitals: 1}}
    A_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    B_c: {fermion: {orbitals: 1}}
    B_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    C_c: {fermion: {orbitals: 1}}
    C_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo 結合はソース順 = general_j(..., 遍歴, 局在) の引数順。
    # 遍歴 A_c/B_c/C_c が第 1 端点 (s_i . S_j の役割と一致)。物理サイト順
    # (A then B then C) で単位胞内を倍加する参照実装の走査順を保持する。
    - {from: A_c, to: A_s, R: [0, 0], type: J}   # Kondo 結合 (物理サイト A, セル内)
    - {from: B_c, to: B_s, R: [0, 0], type: J}   # Kondo 結合 (物理サイト B, セル内)
    - {from: C_c, to: C_s, R: [0, 0], type: J}   # Kondo 結合 (物理サイト C, セル内)
    # --- 最近接 (nn=1) ---
    - {from: A_c, to: B_c, R: [0, 0], type: t2}      # intra 0->1
    - {from: A_c, to: C_c, R: [0, 0], type: t1}      # intra 0->2
    - {from: B_c, to: C_c, R: [0, 0], type: t0}      # intra 1->2
    - {from: B_c, to: A_c, R: [1, 0], type: t2}      # along W
    - {from: C_c, to: A_c, R: [0, 1], type: t1}      # along L
    - {from: B_c, to: C_c, R: [1, -1], type: t0}     # along W-L
    # --- 第二近接 (nn=2) ---
    - {from: C_c, to: A_c, R: [1, 0], type: "t1'"}   # along W, 2->0
    - {from: B_c, to: C_c, R: [1, 0], type: "t0'"}   # along W, 1->2
    - {from: B_c, to: A_c, R: [0, 1], type: "t2'"}   # along L, 1->0
    - {from: C_c, to: B_c, R: [0, 1], type: "t0'"}   # along L, 2->1
    - {from: A_c, to: C_c, R: [1, -1], type: "t1'"}  # along W-L, 0->2
    - {from: A_c, to: B_c, R: [-1, 1], type: "t2'"}  # along L-W, 0->1
    # --- 最近接 (V) ---
    - {from: A_c, to: B_c, R: [0, 0], type: V2}
    - {from: A_c, to: C_c, R: [0, 0], type: V1}
    - {from: B_c, to: C_c, R: [0, 0], type: V0}
    - {from: B_c, to: A_c, R: [1, 0], type: V2}
    - {from: C_c, to: A_c, R: [0, 1], type: V1}
    - {from: B_c, to: C_c, R: [1, -1], type: V0}
    # --- 第二近接 (V) ---
    - {from: C_c, to: A_c, R: [1, 0], type: "V1'"}
    - {from: B_c, to: C_c, R: [1, 0], type: "V0'"}
    - {from: B_c, to: A_c, R: [0, 1], type: "V2'"}
    - {from: C_c, to: B_c, R: [0, 1], type: "V0'"}
    - {from: A_c, to: C_c, R: [1, -1], type: "V1'"}
    - {from: A_c, to: B_c, R: [-1, 1], type: "V2'"}

  couplings:
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}
    J:      {operator: "s_i . S_j", value: {param: J}}   # +J s·S (第1端点=遍歴)

  onsite:
    A_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A_s:
      field_z:                   # 局在側にも同じ 3 成分
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    C_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    C_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
