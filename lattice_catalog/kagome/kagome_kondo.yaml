# StdFace kagome / Kondo lattice model
# Corresponding stan.in input:  model="Kondo" / lattice="kagome" / W=4 / L=4 / t=1.0 / J=1.0
# The 3 physical sites A/B/C are each decomposed into 2 labels, _c (itinerant electron) / _s
# (localized spin) (CONVENTIONS §6.7). The Kondo J bond is 1 per physical site, with the
# itinerant side as the 1st endpoint (A_c->A_s, B_c->B_s, C_c->C_s) — this directly reflects the
# order in which the reference implementation doubles each site within the unit cell (physical-site order A,B,C).
# The field (h/Gamma/Gamma_y) is applied to both the itinerant electrons and the localized spins
# (python/stdface/core/model_plugin.py::KondoModel).
# t0/t1/t2 correspond respectively to the 3 types of intra/inter-cell nearest-neighbor bonds:
# t0=B-C direction, t1=A-C direction, t2=A-B direction. The primed series (t0'/t1'/t2') are
# second-nearest-neighbor bonds. A third-nearest-neighbor (pp) series does not exist in the source.
# The correspondence with the current implementation's site doubling (first half = localized S2, second half = itinerant) is described in manual Section 4.
# Source: python/stdface/lattice/kagome.py::kagome (_BONDS, L164-179), commit 20b2c3cda3a489b5dcd4c9180a19ca23e9280c73

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: kagome, model: kondo}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A_c, frac: [0.0, 0.0]}    # itinerant electron (physical site A, tau[0])
    - {label: A_s, frac: [0.0, 0.0]}    # localized spin (same as above)
    - {label: B_c, frac: [0.5, 0.0]}    # itinerant electron (physical site B, tau[1])
    - {label: B_s, frac: [0.5, 0.0]}    # localized spin (same as above)
    - {label: C_c, frac: [0.0, 0.5]}    # itinerant electron (physical site C, tau[2])
    - {label: C_s, frac: [0.0, 0.5]}    # localized spin (same as above)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # in degrees
    - {twist: {param: phase1}}

model:
  site_dof:
    A_c: {fermion: {orbitals: 1}}
    A_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    B_c: {fermion: {orbitals: 1}}
    B_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    C_c: {fermion: {orbitals: 1}}
    C_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo coupling follows the source order = argument order of general_j(..., itinerant, localized).
    # Itinerant A_c/B_c/C_c is the 1st endpoint (matching the role of s_i . S_j). Preserves the
    # reference implementation's traversal order, which doubles the unit cell in physical-site order (A then B then C).
    - {from: A_c, to: A_s, R: [0, 0], type: J}   # Kondo coupling (physical site A, intra-cell)
    - {from: B_c, to: B_s, R: [0, 0], type: J}   # Kondo coupling (physical site B, intra-cell)
    - {from: C_c, to: C_s, R: [0, 0], type: J}   # Kondo coupling (physical site C, intra-cell)
    # --- nearest neighbor (nn=1) ---
    - {from: A_c, to: B_c, R: [0, 0], type: t2}      # intra 0->1
    - {from: A_c, to: C_c, R: [0, 0], type: t1}      # intra 0->2
    - {from: B_c, to: C_c, R: [0, 0], type: t0}      # intra 1->2
    - {from: B_c, to: A_c, R: [1, 0], type: t2}      # along W
    - {from: C_c, to: A_c, R: [0, 1], type: t1}      # along L
    - {from: B_c, to: C_c, R: [1, -1], type: t0}     # along W-L
    # --- second-nearest neighbor (nn=2) ---
    - {from: C_c, to: A_c, R: [1, 0], type: "t1'"}   # along W, 2->0
    - {from: B_c, to: C_c, R: [1, 0], type: "t0'"}   # along W, 1->2
    - {from: B_c, to: A_c, R: [0, 1], type: "t2'"}   # along L, 1->0
    - {from: C_c, to: B_c, R: [0, 1], type: "t0'"}   # along L, 2->1
    - {from: A_c, to: C_c, R: [1, -1], type: "t1'"}  # along W-L, 0->2
    - {from: A_c, to: B_c, R: [-1, 1], type: "t2'"}  # along L-W, 0->1
    # --- nearest neighbor (V) ---
    - {from: A_c, to: B_c, R: [0, 0], type: V2}
    - {from: A_c, to: C_c, R: [0, 0], type: V1}
    - {from: B_c, to: C_c, R: [0, 0], type: V0}
    - {from: B_c, to: A_c, R: [1, 0], type: V2}
    - {from: C_c, to: A_c, R: [0, 1], type: V1}
    - {from: B_c, to: C_c, R: [1, -1], type: V0}
    # --- second-nearest neighbor (V) ---
    - {from: C_c, to: A_c, R: [1, 0], type: "V1'"}
    - {from: B_c, to: C_c, R: [1, 0], type: "V0'"}
    - {from: B_c, to: A_c, R: [0, 1], type: "V2'"}
    - {from: C_c, to: B_c, R: [0, 1], type: "V0'"}
    - {from: A_c, to: C_c, R: [1, -1], type: "V1'"}
    - {from: A_c, to: B_c, R: [-1, 1], type: "V2'"}

  couplings:
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}
    J:      {operator: "s_i . S_j", value: {param: J}}   # +J s·S (1st endpoint = itinerant)

  onsite:
    A_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A_s:
      field_z:                   # same 3 components apply to the localized side
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    C_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    C_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
