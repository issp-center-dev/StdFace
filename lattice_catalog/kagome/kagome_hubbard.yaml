# StdFace kagome / Hubbard model
# Corresponding stan.in input:  model="Hubbard" / lattice="kagome" / W=4 / L=4 / t=1.0 / U=4.0
# 3-site basis A/B/C (NsiteUC=3, tau=(0,0),(1/2,0),(0,1/2)).
# t0/t1/t2 correspond respectively to the 3 types of intra/inter-cell nearest-neighbor bonds:
# t0=B-C direction, t1=A-C direction, t2=A-B direction. The primed series (t0'/t1'/t2') are
# second-nearest-neighbor bonds. A third-nearest-neighbor (pp) series does not exist in the source.
# Consistency check: the nearest-neighbor coordination number is 4 for each site (a feature of the
# kagome lattice: each site connects to only 2 of the 3 nearest-neighbor bond types, each with coordination number 2).
# See manifest.yaml for the consistency check. Signs are carried as data in scale/coeff (CONVENTIONS §6)
# Source: python/stdface/lattice/kagome.py::kagome (_BONDS, L164-179), commit 20b2c3cda3a489b5dcd4c9180a19ca23e9280c73

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: kagome, model: hubbard}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A, frac: [0.0, 0.0]}    # tau[0]
    - {label: B, frac: [0.5, 0.0]}    # tau[1] = (1/2, 0)
    - {label: C, frac: [0.0, 0.5]}    # tau[2] = (0, 1/2)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # in degrees
    - {twist: {param: phase1}}

model:
  site_dof:
    A: {fermion: {orbitals: 1}}  # extended dialect (CONVENTIONS §7)
    B: {fermion: {orbitals: 1}}
    C: {fermion: {orbitals: 1}}

  bonds:
    # Preserves the source order of the reference implementation (_BONDS). site 0=A, 1=B, 2=C.
    # The t block (hop) is enumerated in _BONDS row order, followed by the V block
    # (density-density) in the same row order (same presentation convention as chain/square/triangular/honeycomb).
    # --- nearest neighbor (nn=1) ---
    - {from: A, to: B, R: [0, 0], type: t2}      # intra 0->1
    - {from: A, to: C, R: [0, 0], type: t1}      # intra 0->2
    - {from: B, to: C, R: [0, 0], type: t0}      # intra 1->2
    - {from: B, to: A, R: [1, 0], type: t2}      # along W
    - {from: C, to: A, R: [0, 1], type: t1}      # along L
    - {from: B, to: C, R: [1, -1], type: t0}     # along W-L
    # --- second-nearest neighbor (nn=2) ---
    - {from: C, to: A, R: [1, 0], type: "t1'"}   # along W, 2->0
    - {from: B, to: C, R: [1, 0], type: "t0'"}   # along W, 1->2
    - {from: B, to: A, R: [0, 1], type: "t2'"}   # along L, 1->0
    - {from: C, to: B, R: [0, 1], type: "t0'"}   # along L, 2->1
    - {from: A, to: C, R: [1, -1], type: "t1'"}  # along W-L, 0->2
    - {from: A, to: B, R: [-1, 1], type: "t2'"}  # along L-W, 0->1
    # --- nearest neighbor (V) ---
    - {from: A, to: B, R: [0, 0], type: V2}
    - {from: A, to: C, R: [0, 0], type: V1}
    - {from: B, to: C, R: [0, 0], type: V0}
    - {from: B, to: A, R: [1, 0], type: V2}
    - {from: C, to: A, R: [0, 1], type: V1}
    - {from: B, to: C, R: [1, -1], type: V0}
    # --- second-nearest neighbor (V) ---
    - {from: C, to: A, R: [1, 0], type: "V1'"}
    - {from: B, to: C, R: [1, 0], type: "V0'"}
    - {from: B, to: A, R: [0, 1], type: "V2'"}
    - {from: C, to: B, R: [0, 1], type: "V0'"}
    - {from: A, to: C, R: [1, -1], type: "V1'"}
    - {from: A, to: B, R: [-1, 1], type: "V2'"}

  couplings:
    # Contribution to H = value × operator (physical coefficient). -t is expressed via scale.
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}   # -t Σσ(c†c+h.c.)
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}    # +V n_i n_j
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}

  onsite:
    A:
      hubbard_u:                 # +U n↑n↓
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:        # -mu N
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:                   # -h Sz (electron spin)
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    C:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
