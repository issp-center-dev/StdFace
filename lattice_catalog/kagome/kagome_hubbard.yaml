# StdFace kagome / Hubbard 模型
# stan.in 対応例:  model="Hubbard" / lattice="kagome" / W=4 / L=4 / t=1.0 / U=4.0
# 3 サイト基底 A/B/C (NsiteUC=3, tau=(0,0),(1/2,0),(0,1/2))。
# t0/t1/t2 は最近接の 3 種のセル内外ボンドにそれぞれ対応する:
# t0=B-C 方向, t1=A-C 方向, t2=A-B 方向。プライム系 (t0'/t1'/t2') は
# 第二近接ボンド。pp (第三近接) 系列はソースに存在しない。
# 検算: 最近接配位数は各サイト 4 (kagome 格子の特徴。各サイトは 3 種の
# 最近接タイプのうち 2 種のみに接続し、それぞれ配位数 2 を持つ)。
# 検算は manifest.yaml を参照。符号は scale/coeff がデータとして持つ (CONVENTIONS 6章)
# 出典: python/stdface/lattice/kagome.py::kagome (_BONDS, L164-179), commit 20b2c3cda3a489b5dcd4c9180a19ca23e9280c73

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: kagome, model: hubbard}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A, frac: [0.0, 0.0]}    # tau[0]
    - {label: B, frac: [0.5, 0.0]}    # tau[1] = (1/2, 0)
    - {label: C, frac: [0.0, 0.5]}    # tau[2] = (0, 1/2)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # 度単位
    - {twist: {param: phase1}}

model:
  site_dof:
    A: {fermion: {orbitals: 1}}  # 拡張方言 (CONVENTIONS 7章)
    B: {fermion: {orbitals: 1}}
    C: {fermion: {orbitals: 1}}

  bonds:
    # 参照実装 (_BONDS) のソース順を保持。site 0=A, 1=B, 2=C。
    # t ブロック (hop) を _BONDS 行順で列挙した後、同じ行順で V ブロック
    # (density-density) を列挙する (chain/square/triangular/honeycomb と同じ提示規約)。
    # --- 最近接 (nn=1) ---
    - {from: A, to: B, R: [0, 0], type: t2}      # intra 0->1
    - {from: A, to: C, R: [0, 0], type: t1}      # intra 0->2
    - {from: B, to: C, R: [0, 0], type: t0}      # intra 1->2
    - {from: B, to: A, R: [1, 0], type: t2}      # along W
    - {from: C, to: A, R: [0, 1], type: t1}      # along L
    - {from: B, to: C, R: [1, -1], type: t0}     # along W-L
    # --- 第二近接 (nn=2) ---
    - {from: C, to: A, R: [1, 0], type: "t1'"}   # along W, 2->0
    - {from: B, to: C, R: [1, 0], type: "t0'"}   # along W, 1->2
    - {from: B, to: A, R: [0, 1], type: "t2'"}   # along L, 1->0
    - {from: C, to: B, R: [0, 1], type: "t0'"}   # along L, 2->1
    - {from: A, to: C, R: [1, -1], type: "t1'"}  # along W-L, 0->2
    - {from: A, to: B, R: [-1, 1], type: "t2'"}  # along L-W, 0->1
    # --- 最近接 (V) ---
    - {from: A, to: B, R: [0, 0], type: V2}
    - {from: A, to: C, R: [0, 0], type: V1}
    - {from: B, to: C, R: [0, 0], type: V0}
    - {from: B, to: A, R: [1, 0], type: V2}
    - {from: C, to: A, R: [0, 1], type: V1}
    - {from: B, to: C, R: [1, -1], type: V0}
    # --- 第二近接 (V) ---
    - {from: C, to: A, R: [1, 0], type: "V1'"}
    - {from: B, to: C, R: [1, 0], type: "V0'"}
    - {from: B, to: A, R: [0, 1], type: "V2'"}
    - {from: C, to: B, R: [0, 1], type: "V0'"}
    - {from: A, to: C, R: [1, -1], type: "V1'"}
    - {from: A, to: B, R: [-1, 1], type: "V2'"}

  couplings:
    # H への寄与 = value × operator (物理係数)。-t は scale で表す。
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}   # -t Σσ(c†c+h.c.)
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}    # +V n_i n_j
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}

  onsite:
    A:
      hubbard_u:                 # +U n↑n↓
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:        # -mu N
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:                   # -h Sz (電子スピン)
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    C:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
