# StdFace pyrochlore / Spin model
# Corresponding stan.in input:  model="Spin" / lattice="pyrochlore" / W=4 / L=4 / Height=4 / J0=1.0
# 4 sublattices (A0..A3, NsiteUC=4). Default FCC lattice vectors. The distinction between the 6
# intra-tetrahedron bonds (R=[0,0,0]) and the 6 inter-tetrahedron bonds (R != 0) is noted in the comments of the bond table below.
# Consistency check: the nearest-neighbor coordination number is 6 for each site (3 series x (1 intra-tetrahedron + 1 inter-tetrahedron) = 6).
# See the pyrochlore/pyrochlore_spin.yaml entry of manifest.yaml for the consistency check.
# Source: python/stdface/lattice/pyrochlore.py::pyrochlore (_BONDS), commit 70fbecd02aeb60df04625843217a08b545c2c8b0

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: pyrochlore, model: spin}

geometry:
  dimension: 3
  lattice_vectors:
    a1: [0.0, 0.5, 0.5]           # StdFace: Wx, Wy, Wz (default: 0, Llength/2, Hlength/2) — FCC
    a2: [0.5, 0.0, 0.5]           # StdFace: Lx, Ly, Lz (default: Wlength/2, 0, Hlength/2)
    a3: [0.5, 0.5, 0.0]           # StdFace: Hx, Hy, Hz (default: Wlength/2, Llength/2, 0)
  sites:
    - {label: A0, frac: [0.0, 0.0, 0.0]}   # tau[0]
    - {label: A1, frac: [0.5, 0.0, 0.0]}   # tau[1]
    - {label: A2, frac: [0.0, 0.5, 0.0]}   # tau[2]
    - {label: A3, frac: [0.0, 0.0, 0.5]}   # tau[3]

system:
  finite: true
  size: [4, 4, 4]                 # StdFace: W, L, Height
  boundary:
    - {twist: {param: phase0}}    # in degrees
    - {twist: {param: phase1}}
    - {twist: {param: phase2}}

model:
  site_dof:
    A0: {spin: {param: 2S, scale: 0.5, default: 0.5}}   # S = 0.5 × 2S. Default S=1/2
    A1: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A2: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A3: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Preserves the source order of the reference implementation (_BONDS). R = [dW, dL, dH].
    # --- intra-tetrahedron (R = [0,0,0], 6 bonds within the unit cell) ---
    - {from: A0, to: A1, R: [0, 0, 0], type: J0}    # along W
    - {from: A0, to: A2, R: [0, 0, 0], type: J1}    # along L
    - {from: A0, to: A3, R: [0, 0, 0], type: J2}    # along H
    - {from: A2, to: A3, R: [0, 0, 0], type: "J0'"}  # along L-H
    - {from: A3, to: A1, R: [0, 0, 0], type: "J1'"}  # along H-W
    - {from: A1, to: A2, R: [0, 0, 0], type: "J2'"}  # along W-L
    # --- inter-tetrahedron (R != [0,0,0], 6 bonds to neighboring unit cells) ---
    - {from: A1, to: A0, R: [1, 0, 0], type: J0}     # along W
    - {from: A2, to: A0, R: [0, 1, 0], type: J1}     # along L
    - {from: A3, to: A0, R: [0, 0, 1], type: J2}     # along H
    - {from: A3, to: A2, R: [0, -1, 1], type: "J0'"}  # along L-H
    - {from: A1, to: A3, R: [1, 0, -1], type: "J1'"}  # along H-W
    - {from: A2, to: A1, R: [-1, 1, 0], type: "J2'"}  # along W-L

  couplings:
    # J family is in canonical 9-component form. Parameter resolution: component > scalar diagonal > global alias > 0
    J0:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J0x}}
          - {ops: [Sy, Sy], coeff: {param: J0y}}
          - {ops: [Sz, Sz], coeff: {param: J0z}}
          - {ops: [Sx, Sy], coeff: {param: J0xy}}
          - {ops: [Sx, Sz], coeff: {param: J0xz}}
          - {ops: [Sy, Sx], coeff: {param: J0yx}}
          - {ops: [Sy, Sz], coeff: {param: J0yz}}
          - {ops: [Sz, Sx], coeff: {param: J0zx}}
          - {ops: [Sz, Sy], coeff: {param: J0zy}}
    J1:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J1x}}
          - {ops: [Sy, Sy], coeff: {param: J1y}}
          - {ops: [Sz, Sz], coeff: {param: J1z}}
          - {ops: [Sx, Sy], coeff: {param: J1xy}}
          - {ops: [Sx, Sz], coeff: {param: J1xz}}
          - {ops: [Sy, Sx], coeff: {param: J1yx}}
          - {ops: [Sy, Sz], coeff: {param: J1yz}}
          - {ops: [Sz, Sx], coeff: {param: J1zx}}
          - {ops: [Sz, Sy], coeff: {param: J1zy}}
    J2:
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: J2x}}
          - {ops: [Sy, Sy], coeff: {param: J2y}}
          - {ops: [Sz, Sz], coeff: {param: J2z}}
          - {ops: [Sx, Sy], coeff: {param: J2xy}}
          - {ops: [Sx, Sz], coeff: {param: J2xz}}
          - {ops: [Sy, Sx], coeff: {param: J2yx}}
          - {ops: [Sy, Sz], coeff: {param: J2yz}}
          - {ops: [Sz, Sx], coeff: {param: J2zx}}
          - {ops: [Sz, Sy], coeff: {param: J2zy}}
    "J0'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J0'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J0'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J0'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J0'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J0'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J0'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J0'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J0'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J0'zy"}}
    "J1'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J1'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J1'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J1'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J1'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J1'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J1'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J1'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J1'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J1'zy"}}
    "J2'":
      operator:
        tensor_terms:
          - {ops: [Sx, Sx], coeff: {param: "J2'x"}}
          - {ops: [Sy, Sy], coeff: {param: "J2'y"}}
          - {ops: [Sz, Sz], coeff: {param: "J2'z"}}
          - {ops: [Sx, Sy], coeff: {param: "J2'xy"}}
          - {ops: [Sx, Sz], coeff: {param: "J2'xz"}}
          - {ops: [Sy, Sx], coeff: {param: "J2'yx"}}
          - {ops: [Sy, Sz], coeff: {param: "J2'yz"}}
          - {ops: [Sz, Sx], coeff: {param: "J2'zx"}}
          - {ops: [Sz, Sy], coeff: {param: "J2'zy"}}

  onsite:
    A0:
      field_z:                   # -h Sz
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:                   # -Gamma Sx
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:                   # -Gamma_y Sy
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:                   # D (Sz)^2
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
    A1:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
    A2:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
    A3:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      aniso_z:
        operator: {tensor_terms: [{ops: [Szz], coeff: 1.0}]}
        value: {param: D}
