# StdFace pyrochlore / Kondo 格子模型
# stan.in 対応例:  model="Kondo" / lattice="pyrochlore" / W=4 / L=4 / Height=4 / t0=1.0 / J=1.0
# 4 副格子 (A0..A3) を各々 _c (遍歴電子) / _s (局在スピン) の 2 ラベルに分解
# (CONVENTIONS 6.7章)。
#
# Kondo 結合: 現行実装は A3_c (副格子3の遍歴サイト) と全局在スピンを
# 結合する (他格子の副格子ごと対応と異なる。上流実装のバグの可能性
# あり — manual 7章参照。上流修正時はカタログの versioning が必要)。
# ソース順保持: general_j(..., isite+3, jsite+uc_i) の引数順で
# 遍歴 A3_c が常に第 1 端点 (s_i . S_j の役割と一致)。
#
# 磁場 (h/Gamma/Gamma_y) は遍歴電子と局在スピンの両方に適用される
# (python/stdface/lattice/pyrochlore.py::_local — hubbard_local が全 _c
# に、mag_field が全 _s に個別に呼ばれる)。
# 現行実装のサイト倍加 (前半=局在 S2, 後半=遍歴) との対応は manual 4章。
# 出典: python/stdface/lattice/pyrochlore.py::pyrochlore (_local, _BONDS), commit 70fbecd02aeb60df04625843217a08b545c2c8b0

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: pyrochlore, model: kondo}

geometry:
  dimension: 3
  lattice_vectors:
    a1: [0.0, 0.5, 0.5]           # StdFace: Wx, Wy, Wz (既定: 0, Llength/2, Hlength/2) — FCC
    a2: [0.5, 0.0, 0.5]           # StdFace: Lx, Ly, Lz (既定: Wlength/2, 0, Hlength/2)
    a3: [0.5, 0.5, 0.0]           # StdFace: Hx, Hy, Hz (既定: Wlength/2, Llength/2, 0)
  sites:
    - {label: A0_c, frac: [0.0, 0.0, 0.0]}  # 遍歴電子 (物理サイト A0, tau[0])
    - {label: A0_s, frac: [0.0, 0.0, 0.0]}  # 局在スピン (同上)
    - {label: A1_c, frac: [0.5, 0.0, 0.0]}  # 遍歴電子 (物理サイト A1, tau[1])
    - {label: A1_s, frac: [0.5, 0.0, 0.0]}  # 局在スピン (同上)
    - {label: A2_c, frac: [0.0, 0.5, 0.0]}  # 遍歴電子 (物理サイト A2, tau[2])
    - {label: A2_s, frac: [0.0, 0.5, 0.0]}  # 局在スピン (同上)
    - {label: A3_c, frac: [0.0, 0.0, 0.5]}  # 遍歴電子 (物理サイト A3, tau[3])
    - {label: A3_s, frac: [0.0, 0.0, 0.5]}  # 局在スピン (同上)

system:
  finite: true
  size: [4, 4, 4]                 # StdFace: W, L, Height
  boundary:
    - {twist: {param: phase0}}    # 度単位
    - {twist: {param: phase1}}
    - {twist: {param: phase2}}

model:
  site_dof:
    A0_c: {fermion: {orbitals: 1}}
    A0_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A1_c: {fermion: {orbitals: 1}}
    A1_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A2_c: {fermion: {orbitals: 1}}
    A2_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    A3_c: {fermion: {orbitals: 1}}
    A3_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo 結合: 現行実装は A3_c (副格子3の遍歴サイト) と全局在スピンを
    # 結合する (他格子の副格子ごと対応と異なる。上流実装のバグの可能性
    # あり — manual 7章参照。上流修正時はカタログの versioning が必要)。
    # ソース順保持: general_j(..., isite+3, jsite+uc_i) の引数順で
    # 遍歴 A3_c が常に第 1 端点 (s_i . S_j の役割と一致)
    - {from: A3_c, to: A0_s, R: [0, 0, 0], type: J}
    - {from: A3_c, to: A1_s, R: [0, 0, 0], type: J}
    - {from: A3_c, to: A2_s, R: [0, 0, 0], type: J}
    - {from: A3_c, to: A3_s, R: [0, 0, 0], type: J}
    # 参照実装 (_BONDS) のソース順を保持。R = [dW, dL, dH]。
    # --- 四面体内 (R = [0,0,0], 単位胞内の 6 本) ---
    - {from: A0_c, to: A1_c, R: [0, 0, 0], type: t0}    # along W
    - {from: A0_c, to: A2_c, R: [0, 0, 0], type: t1}    # along L
    - {from: A0_c, to: A3_c, R: [0, 0, 0], type: t2}    # along H
    - {from: A2_c, to: A3_c, R: [0, 0, 0], type: "t0'"}  # along L-H
    - {from: A3_c, to: A1_c, R: [0, 0, 0], type: "t1'"}  # along H-W
    - {from: A1_c, to: A2_c, R: [0, 0, 0], type: "t2'"}  # along W-L
    # --- 四面体間 (R != [0,0,0], 隣接単位胞への 6 本) ---
    - {from: A1_c, to: A0_c, R: [1, 0, 0], type: t0}     # along W
    - {from: A2_c, to: A0_c, R: [0, 1, 0], type: t1}     # along L
    - {from: A3_c, to: A0_c, R: [0, 0, 1], type: t2}     # along H
    - {from: A3_c, to: A2_c, R: [0, -1, 1], type: "t0'"}  # along L-H
    - {from: A1_c, to: A3_c, R: [1, 0, -1], type: "t1'"}  # along H-W
    - {from: A2_c, to: A1_c, R: [-1, 1, 0], type: "t2'"}  # along W-L
    # --- 四面体内 (V, R = [0,0,0]) ---
    - {from: A0_c, to: A1_c, R: [0, 0, 0], type: V0}    # along W
    - {from: A0_c, to: A2_c, R: [0, 0, 0], type: V1}    # along L
    - {from: A0_c, to: A3_c, R: [0, 0, 0], type: V2}    # along H
    - {from: A2_c, to: A3_c, R: [0, 0, 0], type: "V0'"}  # along L-H
    - {from: A3_c, to: A1_c, R: [0, 0, 0], type: "V1'"}  # along H-W
    - {from: A1_c, to: A2_c, R: [0, 0, 0], type: "V2'"}  # along W-L
    # --- 四面体間 (V, R != [0,0,0]) ---
    - {from: A1_c, to: A0_c, R: [1, 0, 0], type: V0}     # along W
    - {from: A2_c, to: A0_c, R: [0, 1, 0], type: V1}     # along L
    - {from: A3_c, to: A0_c, R: [0, 0, 1], type: V2}     # along H
    - {from: A3_c, to: A2_c, R: [0, -1, 1], type: "V0'"}  # along L-H
    - {from: A1_c, to: A3_c, R: [1, 0, -1], type: "V1'"}  # along H-W
    - {from: A2_c, to: A1_c, R: [-1, 1, 0], type: "V2'"}  # along W-L

  couplings:
    t0:    {operator: "hop", value: {param: t0, scale: -1.0}}
    t1:    {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:    {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'": {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'": {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'": {operator: "hop", value: {param: "t2'", scale: -1.0}}
    V0:    {operator: "density-density", value: {param: V0}}
    V1:    {operator: "density-density", value: {param: V1}}
    V2:    {operator: "density-density", value: {param: V2}}
    "V0'": {operator: "density-density", value: {param: "V0'"}}
    "V1'": {operator: "density-density", value: {param: "V1'"}}
    "V2'": {operator: "density-density", value: {param: "V2'"}}
    J:     {operator: "s_i . S_j", value: {param: J}}   # +J s·S (第1端点=遍歴 A3_c)

  onsite:
    A0_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A0_s:
      field_z:                   # 局在側にも同じ 3 成分
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A1_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A1_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A2_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A2_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A3_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A3_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
