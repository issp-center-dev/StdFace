# StdFace orthorhombic (simple cubic) / Kondo lattice model
# Corresponding stan.in input:  model="Kondo" / lattice="orthorhombic" / W=4 / L=4 / Height=4 / t=1.0 / J=1.0
# The field (h/Gamma/Gamma_y) is applied to both the itinerant electrons and the localized spins
# (python/stdface/core/model_plugin.py::KondoModel).
# The correspondence with the current implementation's site doubling (first half = localized S2, second half = itinerant) is described in manual Section 4.
# Source: python/stdface/lattice/orthorhombic.py::orthorhombic (_BONDS), commit 1cf9f86a394d01f9efe180031e14bfa5d344bfcc

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: orthorhombic, model: kondo}

geometry:
  dimension: 3
  lattice_vectors:
    a1: [1.0, 0.0, 0.0]           # StdFace: Wx, Wy, Wz
    a2: [0.0, 1.0, 0.0]           # StdFace: Lx, Ly, Lz
    a3: [0.0, 0.0, 1.0]           # StdFace: Hx, Hy, Hz
  sites:
    - {label: A_c, frac: [0.0, 0.0, 0.0]}  # itinerant electron (degree of freedom 1 on 1 physical site)
    - {label: A_s, frac: [0.0, 0.0, 0.0]}  # localized spin (degree of freedom 2, same site)

system:
  finite: true
  size: [4, 4, 4]                 # StdFace: W, L, Height
  boundary:
    - {twist: {param: phase0}}    # in degrees
    - {twist: {param: phase1}}
    - {twist: {param: phase2}}

model:
  site_dof:
    A_c: {fermion: {orbitals: 1}}
    A_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo coupling follows the source order = argument order of general_j(..., itinerant, localized).
    # Itinerant A_c is the 1st endpoint (matching the role of s_i . S_j)
    - {from: A_c, to: A_s, R: [0, 0, 0], type: J}   # Kondo coupling (intra-cell)
    # Preserves the source order of the reference implementation (_BONDS). R = [dW, dL, dH]
    # nearest neighbor (nn, coordination number 6)
    - {from: A_c, to: A_c, R: [1, 0, 0], type: t0}     # W direction
    - {from: A_c, to: A_c, R: [0, 1, 0], type: t1}     # L direction
    - {from: A_c, to: A_c, R: [0, 0, 1], type: t2}     # H direction
    # second-nearest neighbor (face diagonal, coordination number 12)
    - {from: A_c, to: A_c, R: [0, 1, 1], type: "t0'"}   # +L+H
    - {from: A_c, to: A_c, R: [0, 1, -1], type: "t0'"}  # +L-H
    - {from: A_c, to: A_c, R: [1, 0, 1], type: "t1'"}   # +H+W
    - {from: A_c, to: A_c, R: [-1, 0, 1], type: "t1'"}  # +H-W
    - {from: A_c, to: A_c, R: [1, 1, 0], type: "t2'"}   # +W+L
    - {from: A_c, to: A_c, R: [1, -1, 0], type: "t2'"}  # +W-L
    # third-nearest neighbor (body diagonal, coordination number 8)
    - {from: A_c, to: A_c, R: [1, 1, 1], type: "t''"}   # +W+L+H
    - {from: A_c, to: A_c, R: [-1, 1, 1], type: "t''"}  # -W+L+H
    - {from: A_c, to: A_c, R: [1, -1, 1], type: "t''"}  # +W-L+H
    - {from: A_c, to: A_c, R: [1, 1, -1], type: "t''"}  # +W+L-H
    # nearest neighbor (nn, coordination number 6)
    - {from: A_c, to: A_c, R: [1, 0, 0], type: V0}     # W direction
    - {from: A_c, to: A_c, R: [0, 1, 0], type: V1}     # L direction
    - {from: A_c, to: A_c, R: [0, 0, 1], type: V2}     # H direction
    # second-nearest neighbor (face diagonal, coordination number 12)
    - {from: A_c, to: A_c, R: [0, 1, 1], type: "V0'"}   # +L+H
    - {from: A_c, to: A_c, R: [0, 1, -1], type: "V0'"}  # +L-H
    - {from: A_c, to: A_c, R: [1, 0, 1], type: "V1'"}   # +H+W
    - {from: A_c, to: A_c, R: [-1, 0, 1], type: "V1'"}  # +H-W
    - {from: A_c, to: A_c, R: [1, 1, 0], type: "V2'"}   # +W+L
    - {from: A_c, to: A_c, R: [1, -1, 0], type: "V2'"}  # +W-L
    # third-nearest neighbor (body diagonal, coordination number 8)
    - {from: A_c, to: A_c, R: [1, 1, 1], type: "V''"}   # +W+L+H
    - {from: A_c, to: A_c, R: [-1, 1, 1], type: "V''"}  # -W+L+H
    - {from: A_c, to: A_c, R: [1, -1, 1], type: "V''"}  # +W-L+H
    - {from: A_c, to: A_c, R: [1, 1, -1], type: "V''"}  # +W+L-H

  couplings:
    t0:    {operator: "hop", value: {param: t0, scale: -1.0}}
    t1:    {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:    {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'": {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'": {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'": {operator: "hop", value: {param: "t2'", scale: -1.0}}
    "t''": {operator: "hop", value: {param: "t''", scale: -1.0}}
    V0:    {operator: "density-density", value: {param: V0}}
    V1:    {operator: "density-density", value: {param: V1}}
    V2:    {operator: "density-density", value: {param: V2}}
    "V0'": {operator: "density-density", value: {param: "V0'"}}
    "V1'": {operator: "density-density", value: {param: "V1'"}}
    "V2'": {operator: "density-density", value: {param: "V2'"}}
    "V''": {operator: "density-density", value: {param: "V''"}}
    J:     {operator: "s_i . S_j", value: {param: J}}   # +J s·S (1st endpoint = itinerant)

  onsite:
    A_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A_s:
      field_z:                   # same 3 components apply to the localized side
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
