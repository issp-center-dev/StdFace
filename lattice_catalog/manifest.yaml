# lattice_catalog consistency-check ledger
#
# Each entry holds the expected values that the linter (tools/lint_catalog.py)
# cross-checks against the YAML body. All keys are mandatory (a missing key is a C10 error).
#
# files:
#   <path to the catalog YAML, relative>:  # e.g. chain/chain_spin.yaml
#     lattice: <must match catalog.lattice>
#     model: <must match catalog.model>
#     dimension: <integer, must match geometry.dimension>
#     n_sites_uc: <integer, must match the number of elements in geometry.sites>
#     bonds_per_uc: {<bond type>: <count per unit cell>, ...}
#       # List every bond type (omission is not allowed).
#     coordination:
#       # Coordination number per site label × bond type.
#       # Measured by counting expansion on the min_size_for_check torus
#       # and compared against the value here (expand_and_count in tools/lint_catalog.py).
#       <label>: {<bond type>: <coordination number>, ...}
#     min_size_for_check: [<size per dimension>, ...]
#       # The minimum size at which distinct R values do not fold onto the same site pair.
#       # For each direction, record the odd number satisfying L > 2 * max|R component|.
#     source:
#       file: <relative path to the referenced Python implementation file>
#       func: <name of the referenced function>
#       commit: <referenced commit hash>
#
# Real entries were added starting with Task 1.
files:
  chain/chain_spin.yaml:
    lattice: chain
    model: spin
    dimension: 1
    n_sites_uc: 1
    bonds_per_uc: {J0: 1, "J0'": 1, "J0''": 1}
    coordination:
      A: {J0: 2, "J0'": 2, "J0''": 2}
    min_size_for_check: [7]
    source: {file: python/stdface/lattice/chain_lattice.py, func: chain, commit: b96aef2107f1ab200565efd496606a01184e3f46}
  chain/chain_hubbard.yaml:
