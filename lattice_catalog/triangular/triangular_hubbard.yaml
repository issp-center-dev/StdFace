# StdFace triangular / Hubbard 模型
# stan.in 対応例:  model="Hubbard" / lattice="triangular" / W=4 / L=4 / t=1.0 / U=4.0
# 検算は manifest.yaml を参照。符号は scale/coeff がデータとして持つ (CONVENTIONS 6章)
# 出典: python/stdface/lattice/triangular_lattice.py::triangular (_BONDS), commit c9ef7c9df93fc73afcf9076cd8bacddbf1d9bf24

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: triangular, model: hubbard}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A, frac: [0.0, 0.0]}

system:
  finite: true
  size: [5, 5]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # 度単位
    - {twist: {param: phase1}}

model:
  site_dof:
    A: {fermion: {orbitals: 1}}  # 拡張方言 (CONVENTIONS 7章)

  bonds:
    - {from: A, to: A, R: [1, 0], type: t0}      # 別名 t (最近接 W 方向)
    - {from: A, to: A, R: [0, 1], type: t1}      # 別名 t (最近接 L 方向)
    - {from: A, to: A, R: [1, -1], type: t2}     # 別名 t (最近接 W-L 対角)
    - {from: A, to: A, R: [2, -1], type: "t1'"}  # 別名 t' (次近接 2W-L)
    - {from: A, to: A, R: [1, 1], type: "t2'"}   # 別名 t' (次近接 W+L)
    - {from: A, to: A, R: [-1, 2], type: "t0'"}  # 別名 t' (次近接 -W+2L)
    - {from: A, to: A, R: [2, 0], type: "t0''"}  # 別名 t'' (三次近接 2W)
    - {from: A, to: A, R: [0, 2], type: "t1''"}  # 別名 t'' (三次近接 2L)
    - {from: A, to: A, R: [2, -2], type: "t2''"} # 別名 t'' (三次近接 2W-2L)
    - {from: A, to: A, R: [1, 0], type: V0}      # 別名 V (最近接 W 方向)
    - {from: A, to: A, R: [0, 1], type: V1}      # 別名 V (最近接 L 方向)
    - {from: A, to: A, R: [1, -1], type: V2}     # 別名 V (最近接 W-L 対角)
    - {from: A, to: A, R: [2, -1], type: "V1'"}  # 別名 V' (次近接 2W-L)
    - {from: A, to: A, R: [1, 1], type: "V2'"}   # 別名 V' (次近接 W+L)
    - {from: A, to: A, R: [-1, 2], type: "V0'"}  # 別名 V' (次近接 -W+2L)
    - {from: A, to: A, R: [2, 0], type: "V0''"}  # 別名 V'' (三次近接 2W)
    - {from: A, to: A, R: [0, 2], type: "V1''"}  # 別名 V'' (三次近接 2L)
    - {from: A, to: A, R: [2, -2], type: "V2''"} # 別名 V'' (三次近接 2W-2L)

  couplings:
    # H への寄与 = value × operator (物理係数)。-t は scale で表す。
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}   # -t Σσ(c†c+h.c.)
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    "t0''": {operator: "hop", value: {param: "t0''", scale: -1.0}}
    "t1''": {operator: "hop", value: {param: "t1''", scale: -1.0}}
    "t2''": {operator: "hop", value: {param: "t2''", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}    # +V n_i n_j
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}
    "V0''": {operator: "density-density", value: {param: "V0''"}}
    "V1''": {operator: "density-density", value: {param: "V1''"}}
    "V2''": {operator: "density-density", value: {param: "V2''"}}

  onsite:
    A:
      hubbard_u:                 # +U n↑n↓
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:        # -mu N
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:                   # -h Sz (電子スピン)
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
