# StdFace wannier90 / Hubbard mini-example (a conversion example of RESPACK/Wannier90 output data)
# Corresponding stan.in input:  model="FermionHubbard" / lattice="wannier90" / W=4 / L=4 / Height=1
# Data source: test/wannier90_data/{zvo_geom.dat, zvo_hr.dat, zvo_ur.dat}
#   (2D square lattice, single Wannier orbital, nearest-neighbor t=-1.0 eV, onsite U=8.0 eV.
#    zvo_jr.dat does not exist, so the J (Hund/exchange/pair-hopping) channel is out of scope
#    — because the data model for the 4-fermion general term is not yet defined in CONVENTIONS §7-6.)
# Source (conversion algorithm): python/stdface/lattice/wannier90.py::_apply_hopping_terms /
#   _apply_coulomb_terms, python/stdface/lattice/wannier90_io.py::_read_w90,
#   python/stdface/lattice/interaction_builder.py::hopping/trans/coulomb,
#   commit da80b6daed27fec0d837812b0613d8b53aa7a637
#
# --- Step 1: Conversion rules (doubles as a draft for manual Section 5) --------------------------
#
# Rule W1 (sign of H_mn(R)): wannier90.py::_apply_hopping_terms (lines 389-406) passes the
#   non-local term as hopping(StdI, -Cphase*tUJ[0][it], jsite, isite, dR)
#   (apparently multiplied by -1, i.e. a sign flip). However interaction_builder.py::hopping
#   (lines 147-191) adds trans(StdI, trans0, jsite, ..., isite, ...) / trans(conj(trans0), isite,
#   ..., jsite, ...), and the convention of trans.def is physical H = -Sum(trans value) c^dagger c
#   (CONVENTIONS §6.1). These two sign flips cancel out, giving
#     physical H's hop coefficient = +H_mn(R) (excluding Cphase; the phase is handled on the system.boundary side)
#   — unlike the t family of the chain/square systems (scale=-1.0, CONVENTIONS §6.2), the
#   wannier90 hop coefficient uses **no sign flip (scale=+1.0)** and takes the raw data directly
#   as the physical coefficient. This has been demonstrated below in Step 5 by numerically
#   cross-checking against the HPhi trans.def output (run with W=4,L=4,Height=1, the trans.def
#   value +1.0 = -(H_mn), consistent).
#
# Rule W2 (R=0 & m=n diagonal elements -> separated into onsite):
#   _apply_hopping_terms (lines 380-388): terms of tUJindx with R=(0,0,0) and m=n are added to
#   trans_list per isite as (-tUJ[0][it], isite, spin, isite, spin) (common to all spins), and are
#   separated out as an onsite unary term rather than a bond.
#   Combined with the trans.def convention (physical H=-Sum t c^dagger c), the physical coefficient
#   is +H_mm(0) times N (the sum of number operators over both spins). In this dataset H_11(0)=0.0
#   (zvo_hr.dat, row 7, below the 5-line header), and since this is below cutoff_t (default 1.0e-8,
#   see rule W5), it is not adopted as an EFFECTIVE term, so no wannier-derived term appears in
#   onsite (= it is zero, so it is omitted; the rule itself is as described above).
#
# Rule W3 (canonical-pair selection for a Hermitian pair): wannier90_io.py::_read_w90 (lines 355-361).
#   Per WSC (R vector) block, "first occurrence in file order wins":
#   if the R of a block matches the -R of an already-read (earlier) block, the entire block
#   (all m,n pairs) is zeroed out wholesale (lines 356-357).
#   Only for the R=(0,0,0) block, the m>n (lower-triangular) elements are additionally zeroed out
#   (lines 359-361; m<=n is canonical).
#   In this data, the WSC appearance order in zvo_hr.dat is
#     (-1,0,0)[row 5] -> (0,-1,0)[row 6] -> (0,0,0)[row 7]
#     -> (0,1,0)[row 8] -> (1,0,0)[row 9]
#   and (0,1,0) matches the reversal of the already-seen (0,-1,0) -> zeroed out,
#   (1,0,0) matches the reversal of the already-seen (-1,0,0) -> zeroed out.
#   So the only canonical pairs are R=(-1,0,0) and R=(0,-1,0) (the excluded
#   R=(0,1,0)/R=(1,0,0) are automatically reconstructed via "+h.c.", so they are not
#   enumerated in bonds).
#
# Rule W4 (WS degeneracy weights): wannier90_io.py::_skip_degeneracy_weights (lines 56-72,
#   called from _read_w90 line 315). The ndegen column in the file header
#   (row 4 of zvo_hr.dat/zvo_ur.dat) is read but **simply discarded and never used** afterward.
#   The only weight actually multiplied in is Weight_tot (initial value 1.0), which is the 0.5
#   halving at the finite-cluster boundary computed from W/L/Height by _apply_boundary_weights
#   (wannier90_io.py lines 129-169, called at line 364); it is unrelated to the file's ndegen
#   values. In this data all ndegen=1, so numerically it has no effect, but as a rule
#   "ndegen is ignored" is the correct statement.
#
# Rule W5 (order in which cutoffs are applied): wannier90_io.py::_read_w90 (lines 255-370).
#   (1) Zero out anything exceeding cutoff_length (real-space length; default: t=-1.0=disabled,
#       U/J=0.3) (lines 338-341). (2) If cutoff_Vec is set, use it; otherwise zero out anything
#       outside the integer box cutoff_R (lines 343-350; the U channel's cutoff_UR defaults to
#       (0,0,0) — by default only R=0 passes). (3) Canonical-pair selection (rule W3).
#       (4) Boundary weights (_apply_boundary_weights, specific to a finite cluster; the bonds
#       of this catalog are a unit-cell-relative representation of an infinite lattice, so this
#       **does not apply**). (5) Elements below the amplitude cutoff (cutoff_t/u/j, default
#       1.0e-8) are excluded from the EFFECTIVE terms (wannier90_io.py::_count_and_store_terms
#       line 223).
#   This catalog's cutoff: it **applies only cutoff_t = cutoff_u = 1.0e-8 (the implementation's
#   default values), and does not apply any additional range restriction via cutoff_length /
#   cutoff_R / cutoff_Vec** (it has been individually confirmed that all R in this data satisfy
#   |each R component| <= 1, and so are not subject to the length/R/Vec defaults — the U channel
#   is R=0 only, so it also passes the default cutoff_UR=(0,0,0)). All elements within this
#   cutoff (H: 2 bonds, U: 1 term) are converted below **in full** (this is not a top-N extraction).
#
# Rule W6 (where lambda_U/lambda_J/alpha/doublecounting act):
#   - lambda_U (wannier90.py line 889, 757-762, default 1.0): multiplied into the raw data when
#     the U channel is read (wannier90_io.py line 353: Mat_tot=lam*(re+i*im)).
#     In this catalog lambda_U defaults to 1.0, so U=8.0 is unchanged (8.0*1.0=8.0).
#   - alpha (wannier90.py lines 772-776, default 0.5) and doublecounting_mode
#     (_apply_coulomb_terms lines 458-509, _apply_hund_terms lines 569-603) only add an onsite
#     double-counting correction term (and, in FULL mode, an additional hopping correction term)
#     to trans_list when a `_dr.dat` density-matrix file exists and doublecounting_mode != "none".
#     This dataset has no `_dr.dat`, and doublecounting_mode defaults to "none"
#     (_DCMode.NOTCORRECT), so **none of this is triggered at all** in this catalog (the branch
#     for idcmode != NOTCORRECT is never reached).
#
# --- Step 5: Consistency check (by hand, >= 2 elements) -------------------------------------
# Check 1 (t0): zvo_hr.dat row 5 "-1 0 0 1 1 -1.00000000 0.00000000"
#   -> R=(-1,0,0), m=n=1 (0-index 0), H_00(R)=-1.0. Amplitude |-1.0|>1e-8 -> adopted.
#   By rule W1, physical coefficient = +H_00(R) = -1.0. Running the implementation with
#   W=4,L=4,Height=1 and checking trans.def shows "0 0 3 0  1.000000... 0.0"
#   is output (site0-site3 is the x-direction NN on a 4x4 lattice). By the trans.def convention
#   H_trans=-Sum t(trans value) c^dagger c, physical coefficient = -(+1.0) = -1.0 = H_00(R), consistent
#   (no sign flip, confirming rule W1).
# Check 2 (hubbard_u): zvo_ur.dat row 5 "0 0 0 1 1 8.00000000 0.00000000"
#   -> R=(0,0,0), m=n=1, U_11(0)=8.0. A local term -> added to Cintra_list as (8.0*1.0, site)
#   (with lambda_U=1.0 default). Checking coulombintra.def in the same stan.in run shows each
#   site's CoulombIntra value as "8.000000000000000" — consistent with the raw data's
#   8.0 (no sign flip). Physical H = +U n↑n↓ (as tabulated in CONVENTIONS §6.2).
# Check 3 (t1, for reference): zvo_hr.dat row 6 "0 -1 0 1 1 -1.00000000 0.00000000"
#   -> R=(0,-1,0), H_00(R)=-1.0. In the trans.def of the same stan.in run,
#   "0 0 12 0  1.000000... 0.0" (site0-site12, y-direction NN) appears, consistent with
#   the physical coefficient -1.0 in the same way as Check 1.

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: wannier90, model: hubbard}

geometry:
  dimension: 3
  lattice_vectors:
    a1: [3.0, 0.0, 0.0]     # zvo_geom.dat row 1
    a2: [0.0, 3.0, 0.0]     # zvo_geom.dat row 2
    a3: [0.0, 0.0, 10.0]    # zvo_geom.dat row 3 (vacuum layer. physically a 2D slab)
  sites:
    - {label: W1, frac: [0.0, 0.0, 0.0]}   # zvo_geom.dat row 5 (Wannier center)

system:
  finite: true
  size: [4, 4, 1]              # StdFace: W, L, Height (corresponding stan.in input)
  boundary:
    - {twist: {param: phase0}}  # in degrees
    - {twist: {param: phase1}}
    - {twist: {param: phase2}}

model:
  site_dof:
    W1: {fermion: {orbitals: 1}}  # extended dialect (CONVENTIONS §7). zvo_geom.dat: NsiteUC=1

  bonds:
    # Only canonical pairs are enumerated per rule W3. The excluded reversed pairs (0,1,0)/(1,0,0)
    # are automatically reconstructed via "+ h.c." (the definition of the hop operator,
    # CONVENTIONS §6.6), so they are not written here.
    - {from: W1, to: W1, R: [-1, 0, 0], type: t0}  # zvo_hr.dat row 5
    - {from: W1, to: W1, R: [0, -1, 0], type: t1}  # zvo_hr.dat row 6

  couplings:
    # Values are the raw real numbers from external data, written directly (param references are
    # not possible here; C7 skips values that are not a dict, so a direct literal passes the linter).
    # Rule W1 means no sign flip: physical coefficient = +H_mn(R) as-is.
    t0: {operator: "hop", value: -1.0}   # H_00(R=[-1,0,0]) = -1.0 (Check 1)
    t1: {operator: "hop", value: -1.0}   # H_00(R=[0,-1,0]) = -1.0 (Check 3)

  onsite:
    W1:
      hubbard_u:                 # +U n↑n↓ (rule W6: applied with lambda_U=1.0 default)
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: 8.0                # U_11(R=[0,0,0]) = 8.0 (Check 2, raw external-data literal)
      chemical_potential:        # -mu N (a standard StdFace parameter, independent of the wannier data)
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:                   # -h Sz (electron spin)
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
      # Rule W2: the wannier-derived R=0,m=n diagonal element (H_11(0)=0.0, zvo_hr.dat row 7)
      # is below cutoff_t (default 1e-8), so it does not become an EFFECTIVE term and does not
      # appear as an onsite entry (it is omitted because it is zero; the rule itself, if
      # nonzero, would take the same form as hubbard_u above: {ops:[N], coeff:1.0}, value:<H_mm(0)>).
