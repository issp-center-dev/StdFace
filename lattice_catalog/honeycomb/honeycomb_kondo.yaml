# StdFace honeycomb / Kondo lattice model
# Corresponding stan.in input:  model="Kondo" / lattice="honeycomb" / W=4 / L=4 / t=1.0 / J=1.0
# The 2 physical sites A/B are each decomposed into 2 labels, _c (itinerant electron) / _s
# (localized spin) (CONVENTIONS §6.7). The Kondo J bond is 1 per physical site, with the
# itinerant side as the 1st endpoint (A_c->A_s, B_c->B_s) — this directly reflects the order
# in which the reference implementation doubles each site within the unit cell.
# The field (h/Gamma/Gamma_y) is applied to both the itinerant electrons and the localized spins
# (python/stdface/core/model_plugin.py::KondoModel).
# The correspondence with the current implementation's site doubling (first half = localized S2, second half = itinerant) is described in manual Section 4.
# Source: python/stdface/lattice/honeycomb_lattice.py::honeycomb (_BONDS), commit e42ef547c5fb073d78200752c5c5ff01375d4619

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: honeycomb, model: kondo}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A_c, frac: [0.0, 0.0]}                             # itinerant electron (physical site A, tau[0])
    - {label: A_s, frac: [0.0, 0.0]}                             # localized spin (same as above)
    - {label: B_c, frac: [0.3333333333333333, 0.3333333333333333]}  # itinerant electron (physical site B, tau[1])
    - {label: B_s, frac: [0.3333333333333333, 0.3333333333333333]}  # localized spin (same as above)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # in degrees
    - {twist: {param: phase1}}

model:
  site_dof:
    A_c: {fermion: {orbitals: 1}}
    A_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}
    B_c: {fermion: {orbitals: 1}}
    B_s: {spin: {param: 2S, scale: 0.5, default: 0.5}}

  bonds:
    # Kondo coupling follows the source order = argument order of general_j(..., itinerant, localized).
    # Itinerant A_c/B_c is the 1st endpoint (matching the role of s_i . S_j). Preserves the
    # reference implementation's traversal order, which doubles the unit cell in physical-site order (A then B).
    - {from: A_c, to: A_s, R: [0, 0], type: J}   # Kondo coupling (physical site A, intra-cell)
    - {from: B_c, to: B_s, R: [0, 0], type: J}   # Kondo coupling (physical site B, intra-cell)
    # --- nearest neighbor (nn=1): Kitaev x/y/z convention, t1=x, t2=y, t0=z ---
    - {from: A_c, to: B_c, R: [0, 0], type: t0}      # intra-cell bond (Kitaev z equivalent)
    - {from: B_c, to: A_c, R: [1, 0], type: t1}      # W direction (Kitaev x equivalent)
    - {from: B_c, to: A_c, R: [0, 1], type: t2}      # L direction (Kitaev y equivalent)
    # --- second-nearest neighbor (nn=2) ---
    - {from: A_c, to: A_c, R: [1, 0], type: "t2'"}
    - {from: B_c, to: B_c, R: [1, 0], type: "t2'"}
    - {from: A_c, to: A_c, R: [0, 1], type: "t1'"}
    - {from: B_c, to: B_c, R: [0, 1], type: "t1'"}
    - {from: A_c, to: A_c, R: [1, -1], type: "t0'"}
    - {from: B_c, to: B_c, R: [1, -1], type: "t0'"}
    # --- third-nearest neighbor (nn=3) ---
    - {from: A_c, to: B_c, R: [1, -1], type: "t1''"}
    - {from: A_c, to: B_c, R: [-1, -1], type: "t0''"}
    - {from: A_c, to: B_c, R: [-1, 1], type: "t2''"}
    # --- nearest neighbor (V) ---
    - {from: A_c, to: B_c, R: [0, 0], type: V0}
    - {from: B_c, to: A_c, R: [1, 0], type: V1}
    - {from: B_c, to: A_c, R: [0, 1], type: V2}
    # --- second-nearest neighbor (V) ---
    - {from: A_c, to: A_c, R: [1, 0], type: "V2'"}
    - {from: B_c, to: B_c, R: [1, 0], type: "V2'"}
    - {from: A_c, to: A_c, R: [0, 1], type: "V1'"}
    - {from: B_c, to: B_c, R: [0, 1], type: "V1'"}
    - {from: A_c, to: A_c, R: [1, -1], type: "V0'"}
    - {from: B_c, to: B_c, R: [1, -1], type: "V0'"}
    # --- third-nearest neighbor (V) ---
    - {from: A_c, to: B_c, R: [1, -1], type: "V1''"}
    - {from: A_c, to: B_c, R: [-1, -1], type: "V0''"}
    - {from: A_c, to: B_c, R: [-1, 1], type: "V2''"}

  couplings:
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1''": {operator: "hop", value: {param: "t1''", scale: -1.0}}
    "t0''": {operator: "hop", value: {param: "t0''", scale: -1.0}}
    "t2''": {operator: "hop", value: {param: "t2''", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1''": {operator: "density-density", value: {param: "V1''"}}
    "V0''": {operator: "density-density", value: {param: "V0''"}}
    "V2''": {operator: "density-density", value: {param: "V2''"}}
    J:      {operator: "s_i . S_j", value: {param: J}}   # +J s·S (1st endpoint = itinerant)

  onsite:
    A_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    A_s:
      field_z:                   # same 3 components apply to the localized side
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B_c:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B_s:
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
