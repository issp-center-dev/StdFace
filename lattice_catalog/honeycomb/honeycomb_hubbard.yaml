# StdFace honeycomb / Hubbard model
# Corresponding stan.in input:  model="Hubbard" / lattice="honeycomb" / W=4 / L=4 / t=1.0 / U=4.0
# 2-site basis A/B (NsiteUC=2). t0/t1/t2 correspond respectively to the 3 nearest-neighbor bond
# directions (Kitaev x/y/z convention): t0=intra-cell bond (z equivalent), t1=W direction (x equivalent), t2=L direction (y equivalent).
# Consistency check: the nearest-neighbor coordination number is 3 for each site (t0+t1+t2, 1 bond each).
# See manifest.yaml for the consistency check. Signs are carried as data in scale/coeff (CONVENTIONS §6)
# Source: python/stdface/lattice/honeycomb_lattice.py::honeycomb (_BONDS), commit e42ef547c5fb073d78200752c5c5ff01375d4619

catalog: {schema: stdface-catalog/0.1, dialect: experimental, lattice: honeycomb, model: hubbard}

geometry:
  dimension: 2
  lattice_vectors:
    a1: [1.0, 0.0]                         # StdFace: Wx, Wy
    a2: [0.5, 0.8660254037844386]          # StdFace: Lx, Ly
  sites:
    - {label: A, frac: [0.0, 0.0]}                             # tau[0]
    - {label: B, frac: [0.3333333333333333, 0.3333333333333333]}  # tau[1] = (1/3, 1/3)

system:
  finite: true
  size: [3, 3]                    # StdFace: W, L
  boundary:
    - {twist: {param: phase0}}    # in degrees
    - {twist: {param: phase1}}

model:
  site_dof:
    A: {fermion: {orbitals: 1}}  # extended dialect (CONVENTIONS §7)
    B: {fermion: {orbitals: 1}}

  bonds:
    # Preserves the source order of the reference implementation (_BONDS). site 0=A, 1=B.
    # The t block (hop) is enumerated in _BONDS row order, followed by the V block
    # (density-density) in the same row order (same presentation convention as chain/square/triangular).
    # --- nearest neighbor (nn=1): Kitaev x/y/z convention, t1=x, t2=y, t0=z ---
    - {from: A, to: B, R: [0, 0], type: t0}      # intra-cell bond (Kitaev z equivalent)
    - {from: B, to: A, R: [1, 0], type: t1}      # W direction (Kitaev x equivalent)
    - {from: B, to: A, R: [0, 1], type: t2}      # L direction (Kitaev y equivalent)
    # --- second-nearest neighbor (nn=2) ---
    - {from: A, to: A, R: [1, 0], type: "t2'"}   # W direction, 0->0
    - {from: B, to: B, R: [1, 0], type: "t2'"}   # W direction, 1->1
    - {from: A, to: A, R: [0, 1], type: "t1'"}   # L direction, 0->0
    - {from: B, to: B, R: [0, 1], type: "t1'"}   # L direction, 1->1
    - {from: A, to: A, R: [1, -1], type: "t0'"}  # W-L direction, 0->0
    - {from: B, to: B, R: [1, -1], type: "t0'"}  # W-L direction, 1->1
    # --- third-nearest neighbor (nn=3) ---
    - {from: A, to: B, R: [1, -1], type: "t1''"}   # W-L direction
    - {from: A, to: B, R: [-1, -1], type: "t0''"}  # -W-L direction
    - {from: A, to: B, R: [-1, 1], type: "t2''"}   # -W+L direction
    # --- nearest neighbor (V) ---
    - {from: A, to: B, R: [0, 0], type: V0}
    - {from: B, to: A, R: [1, 0], type: V1}
    - {from: B, to: A, R: [0, 1], type: V2}
    # --- second-nearest neighbor (V) ---
    - {from: A, to: A, R: [1, 0], type: "V2'"}
    - {from: B, to: B, R: [1, 0], type: "V2'"}
    - {from: A, to: A, R: [0, 1], type: "V1'"}
    - {from: B, to: B, R: [0, 1], type: "V1'"}
    - {from: A, to: A, R: [1, -1], type: "V0'"}
    - {from: B, to: B, R: [1, -1], type: "V0'"}
    # --- third-nearest neighbor (V) ---
    - {from: A, to: B, R: [1, -1], type: "V1''"}
    - {from: A, to: B, R: [-1, -1], type: "V0''"}
    - {from: A, to: B, R: [-1, 1], type: "V2''"}

  couplings:
    # Contribution to H = value × operator (physical coefficient). -t is expressed via scale.
    t0:     {operator: "hop", value: {param: t0, scale: -1.0}}   # -t Σσ(c†c+h.c.)
    t1:     {operator: "hop", value: {param: t1, scale: -1.0}}
    t2:     {operator: "hop", value: {param: t2, scale: -1.0}}
    "t2'":  {operator: "hop", value: {param: "t2'", scale: -1.0}}
    "t1'":  {operator: "hop", value: {param: "t1'", scale: -1.0}}
    "t0'":  {operator: "hop", value: {param: "t0'", scale: -1.0}}
    "t1''": {operator: "hop", value: {param: "t1''", scale: -1.0}}
    "t0''": {operator: "hop", value: {param: "t0''", scale: -1.0}}
    "t2''": {operator: "hop", value: {param: "t2''", scale: -1.0}}
    V0:     {operator: "density-density", value: {param: V0}}    # +V n_i n_j
    V1:     {operator: "density-density", value: {param: V1}}
    V2:     {operator: "density-density", value: {param: V2}}
    "V2'":  {operator: "density-density", value: {param: "V2'"}}
    "V1'":  {operator: "density-density", value: {param: "V1'"}}
    "V0'":  {operator: "density-density", value: {param: "V0'"}}
    "V1''": {operator: "density-density", value: {param: "V1''"}}
    "V0''": {operator: "density-density", value: {param: "V0''"}}
    "V2''": {operator: "density-density", value: {param: "V2''"}}

  onsite:
    A:
      hubbard_u:                 # +U n↑n↓
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:        # -mu N
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:                   # -h Sz (electron spin)
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
    B:
      hubbard_u:
        operator: {tensor_terms: [{ops: [NupNdn], coeff: 1.0}]}
        value: {param: U}
      chemical_potential:
        operator: {tensor_terms: [{ops: [N], coeff: -1.0}]}
        value: {param: mu}
      field_z:
        operator: {tensor_terms: [{ops: [Sz], coeff: -1.0}]}
        value: {param: h}
      field_x:
        operator: {tensor_terms: [{ops: [Sx], coeff: -1.0}]}
        value: {param: Gamma}
      field_y:
        operator: {tensor_terms: [{ops: [Sy], coeff: -1.0}]}
        value: {param: Gamma_y}
