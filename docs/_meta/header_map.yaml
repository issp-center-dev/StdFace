# header_map.yaml - Public API surface per header
# Generated: 2026-01-10 (Phase 1 Repo Cartography)
#
# NOTE: No include/ directory exists. All headers are in src/.
# Per claude.md Section 1, public API should be in include/, but this project
# uses src/ for all headers. Documented as-is without inference.

headers:
  StdFace_ModelUtil.h:
    path: src/StdFace_ModelUtil.h
    description: "Core model utilities for lattice construction and interactions"
    functions:
      # Exit/Error handling
      - StdFace_exit
      # Interaction generators
      - StdFace_intr
      - StdFace_Hopping
      - StdFace_trans
      - StdFace_HubbardLocal
      - StdFace_MagField
      - StdFace_Coulomb
      - StdFace_GeneralJ
      # Print utilities
      - StdFace_PrintVal_d
      - StdFace_PrintVal_dd
      - StdFace_PrintVal_c
      - StdFace_PrintVal_i
      # Validation/check utilities
      - StdFace_NotUsed_d
      - StdFace_NotUsed_i
      - StdFace_NotUsed_c
      - StdFace_NotUsed_J
      - StdFace_RequiredVal_i
      # Input parsing
      - StdFace_InputSpinNN
      - StdFace_InputSpin
      - StdFace_InputCoulombV
      - StdFace_InputHopp
      # Site/lattice utilities
      - StdFace_InitSite
      - StdFace_SetLabel
      - StdFace_PrintGeometry
      - StdFace_MallocInteractions
      - StdFace_FindSite
      - StdFace_PrintXSF
      # Lattice constructors
      - StdFace_Tetragonal
      - StdFace_Chain
      - StdFace_Ladder
      - StdFace_Triangular
      - StdFace_Honeycomb
      - StdFace_Kagome
      - StdFace_Orthorhombic
      - StdFace_FCOrtho
      - StdFace_Pyrochlore
      - StdFace_Wannier90
    types: []
    macros: []

  StdFace_vals.h:
    path: src/StdFace_vals.h
    description: "Parameter structure (StdIntList) holding all model/lattice configuration"
    functions: []
    types:
      - name: StdIntList
        kind: struct
        description: "Main configuration structure for lattice models and interactions"
        fields_count: 125  # Approximate; includes lattice, model, and interaction params
    macros: []
    notable_fields:
      # Lattice parameters
      - lattice
      - W
      - L
      - Height
      - NCell
      - NsiteUC
      # Model parameters
      - model
      - mu
      - t
      - tp
      - U
      - V
      - J
      # Output control
      - outputmode
      - CDataFileHead

  setmemory.h:
    path: src/setmemory.h
    description: "Memory allocation and deallocation utilities"
    functions:
      # Unsigned int 1D
      - ui_1d_allocate
      - free_ui_1d_allocate
      # Long int 1D
      - li_1d_allocate
      - free_li_1d_allocate
      # Long int 2D
      - li_2d_allocate
      - free_li_2d_allocate
      # Long unsigned int 1D
      - lui_1d_allocate
      - free_lui_1d_allocate
      # Int 1D/2D/3D
      - i_1d_allocate
      - free_i_1d_allocate
      - i_2d_allocate
      - free_i_2d_allocate
      - i_3d_allocate
      - free_i_3d_allocate
      # Double 1D/2D
      - d_1d_allocate
      - free_d_1d_allocate
      - d_2d_allocate
      - free_d_2d_allocate
      # Complex double 1D/2D/3D
      - cd_1d_allocate
      - free_cd_1d_allocate
      - cd_2d_allocate
      - free_cd_2d_allocate
      - cd_3d_allocate
      - free_cd_3d_allocate
    types: []
    macros:
      - name: MVMC_SETMEMORY_H
        kind: include_guard

  export_wannier90.h:
    path: src/export_wannier90.h
    description: "Wannier90 export functions (HWAVE mode only)"
    conditional: "_HWAVE"
    functions:
      - ExportGeometry
      - ExportInteraction
    types: []
    macros:
      - name: EXPORT_WANNIER90_INCLUDED
        kind: include_guard

  version.h:
    path: src/version.h
    description: "Version information and printing"
    functions:
      - printVersion
    types: []
    macros:
      - name: VERSION_MAJOR
        value: 0
      - name: VERSION_MINOR
        value: 5
      - name: VERSION_PATCH
        value: 0
      - name: VERSION_PRERELEASE
        value: '""'
      - name: _INCLUDE_VERSION
        kind: include_guard

# Summary statistics
summary:
  total_headers: 5
  total_functions: 64
  total_types: 1
  total_macros: 7
